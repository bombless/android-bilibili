<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Bilibili AI 智能视频推荐服务</title>
  <style>
    :root {
      --primary: #fb7299;
      --primary-hover: #e06087;
      --primary-light: #fff0f4;
      --primary-dark: #cc5477;
      --secondary: #00aeec;
      --bg-page: #f6f7f8;
      --bg-card: #ffffff;
      --text-main: #18191c;
      --text-secondary: #61666d;
      --text-muted: #9499a0;
      --border: #e3e5e7;
      --radius: 14px;
      --shadow: 0 4px 18px rgba(0, 0, 0, 0.05);
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font);
      background-color: var(--bg-page);
      color: var(--text-main);
      line-height: 1.5;
      padding: 24px 16px 60px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      background: var(--bg-card);
      padding: 16px 24px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      flex-wrap: wrap;
      gap: 12px;
    }

    .logo-box {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #fb7299 0%, #ff8eb3 100%);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 900;
      font-size: 20px;
      box-shadow: 0 4px 12px rgba(251, 114, 153, 0.35);
    }

    .logo-text h1 {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-main);
    }

    .logo-text p {
      font-size: 13px;
      color: var(--text-muted);
    }

    .badge-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      background: #e8f8f0;
      color: #10b981;
    }

    .badge-status::before {
      content: "";
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.2); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* Main Grid */
    .grid {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 24px;
    }

    @media (max-width: 900px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      margin-bottom: 24px;
      border: 1px solid var(--border);
    }

    .card-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text-main);
    }

    /* QR Code Section */
    .qr-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 10px 0;
    }

    .qr-wrapper {
      width: 220px;
      height: 220px;
      border: 2px dashed var(--primary);
      border-radius: 16px;
      padding: 8px;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
      box-shadow: 0 4px 14px rgba(251, 114, 153, 0.15);
    }

    .qr-wrapper img {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 8px;
    }

    .url-chip {
      background: #f1f2f3;
      padding: 8px 12px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 12px;
      color: var(--text-secondary);
      word-break: break-all;
      margin-bottom: 12px;
      max-width: 100%;
      border: 1px solid var(--border);
      position: relative;
    }

    .btn-group {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    button {
      cursor: pointer;
      border: none;
      outline: none;
      font-family: inherit;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
      font-weight: 600;
      padding: 10px 16px;
      border-radius: 8px;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: #f1f2f3;
      color: var(--text-secondary);
      font-weight: 600;
      padding: 10px 14px;
      border-radius: 8px;
    }

    .btn-secondary:hover {
      background: #e3e5e7;
      color: var(--text-main);
    }

    /* Address Switcher */
    .address-switch {
      margin-top: 14px;
      width: 100%;
      background: #fafbfc;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      text-align: left;
    }

    .address-switch-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .address-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .address-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 10px;
      background: white;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      border: 1px solid var(--border);
    }

    .address-item.active {
      border-color: var(--primary);
      background: var(--primary-light);
      color: var(--primary-dark);
      font-weight: 700;
    }

    .address-item:hover:not(.active) {
      background: #f8f9fa;
    }

    /* Settings Section */
    .form-group {
      margin-bottom: 14px;
    }

    .form-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
      display: block;
    }

    .form-input {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      background: #fafbfc;
      transition: all 0.2s;
    }

    .form-input:focus {
      background: white;
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(251, 114, 153, 0.2);
    }

    .chips-box {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }

    .chip {
      background: #f1f2f3;
      padding: 4px 10px;
      border-radius: 14px;
      font-size: 12px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--text-secondary);
    }

    .chip .chip-del {
      cursor: pointer;
      color: var(--text-muted);
      font-weight: bold;
    }

    .chip .chip-del:hover {
      color: #ff4d4f;
    }

    /* Recommendations Stream */
    .recommend-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .search-input-box {
      display: flex;
      gap: 8px;
      flex: 1;
      min-width: 260px;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 18px;
    }

    .video-card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .video-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    .video-thumb-box {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #e3e5e7;
      overflow: hidden;
    }

    .video-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .video-duration {
      position: absolute;
      bottom: 6px;
      right: 6px;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 500;
    }

    .video-source-badge {
      position: absolute;
      top: 6px;
      left: 6px;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      color: white;
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 4px;
      font-weight: 500;
    }

    .video-content {
      padding: 12px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .video-title {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.4;
      max-height: 2.8em;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      margin-bottom: 8px;
      color: var(--text-main);
      text-decoration: none;
    }

    .video-title:hover {
      color: var(--primary);
    }

    .video-reason-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #fff2e8;
      color: #ff6600;
      border: 1px solid #ffbb96;
      border-radius: 4px;
      padding: 3px 8px;
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 10px;
      align-self: flex-start;
    }

    .video-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
      font-size: 12px;
      color: var(--text-muted);
    }

    .video-up {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .up-avatar {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #ccc;
      object-fit: cover;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #333333;
      color: white;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 13px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      z-index: 9999;
    }

    .toast.show {
      opacity: 1;
    }

    .loading-state {
      text-align: center;
      padding: 40px 0;
      color: var(--text-muted);
    }

    .spinner {
      display: inline-block;
      width: 32px;
      height: 32px;
      border: 3px solid rgba(251, 114, 153, 0.2);
      border-radius: 50%;
      border-top-color: var(--primary);
      animation: spin 1s ease-in-out infinite;
      margin-bottom: 12px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Header -->
  <header>
    <div class="logo-box">
      <div class="logo-icon">B</div>
      <div class="logo-text">
        <h1>Bilibili AI 智能推荐服务端</h1>
        <p>免登录多源抓取 • 关注动态与相关拓展 • Chat Completions 大模型深度分析</p>
      </div>
    </div>
    <div class="badge-status" id="serverStatusBadge">服务运行正常</div>
  </header>

  <!-- Main Grid Layout -->
  <div class="grid">
    <!-- Left Column: QR Code & Connection -->
    <div>
      <!-- QR Code Card -->
      <div class="card">
        <div class="card-title">
          <span>📱 安卓 App 扫码直连</span>
          <span style="font-size: 12px; font-weight: normal; color: var(--text-muted);">自动识别网址</span>
        </div>

        <div class="qr-container">
          <div class="qr-wrapper">
            <img id="qrImage" src="" alt="推荐服务连接二维码">
          </div>

          <div class="url-chip" id="urlDisplay">正在读取网址...</div>

          <div class="btn-group">
            <button class="btn-primary" onclick="copyCurrentUrl()">
              <span>📋 复制网址</span>
            </button>
            <button class="btn-secondary" onclick="toggleApiUrlMode()" id="urlModeBtn">
              切换API路径
            </button>
          </div>

          <!-- Network Address Switcher -->
          <div class="address-switch">
            <div class="address-switch-title">🌐 切换扫码连接地址:</div>
            <div class="address-list" id="addressList">
              <!-- Dynamically populated -->
            </div>
            <p style="font-size: 11px; color: var(--text-muted); margin-top: 6px;">
              💡 提示：手机与电脑在同一 Wi-Fi 下时，请选用 <strong>局域网 IP</strong> 扫码连接。
            </p>
          </div>
        </div>
      </div>

      <!-- AI & Follow List Settings Card -->
      <div class="card">
        <div class="card-title">
          <span>⚙️ 推荐配置 & 大模型接口</span>
          <button class="btn-secondary" style="padding: 4px 8px; font-size: 12px;" onclick="saveConfig()">保存配置</button>
        </div>

        <!-- Chat Completions Key -->
        <div class="form-group">
          <label class="form-label">OpenAI 兼容 API Key (可选)</label>
          <input type="password" class="form-input" id="cfgApiKey" placeholder="sk-xxxx (留空自动使用内置智能规则)">
        </div>

        <!-- Base URL -->
        <div class="form-group">
          <label class="form-label">Base URL</label>
          <input type="text" class="form-input" id="cfgBaseUrl" placeholder="https://api.openai.com/v1 或 DeepSeek/硅基流动">
        </div>

        <!-- Model -->
        <div class="form-group">
          <label class="form-label">Model 名称</label>
          <input type="text" class="form-input" id="cfgModel" placeholder="gpt-4o-mini / deepseek-chat">
        </div>

        <!-- Followed Creators -->
        <div class="form-group">
          <label class="form-label">关注列表 / 创作者 (免登录抓取来源)</label>
          <div style="display: flex; gap: 6px;">
            <input type="text" class="form-input" id="newCreatorInput" placeholder="输入UP主名称回车添加">
            <button class="btn-secondary" onclick="addCreator()">添加</button>
          </div>
          <div class="chips-box" id="creatorsChips"></div>
        </div>

        <!-- Preferences -->
        <div class="form-group">
          <label class="form-label">兴趣喜好标签 (用于相关拓展推荐)</label>
          <div style="display: flex; gap: 6px;">
            <input type="text" class="form-input" id="newPrefInput" placeholder="输入喜好标签回车添加">
            <button class="btn-secondary" onclick="addPref()">添加</button>
          </div>
          <div class="chips-box" id="prefsChips"></div>
        </div>

        <!-- Strategy switches -->
        <div class="form-group" style="display: flex; flex-direction: column; gap: 8px; margin-top: 10px;">
          <label style="font-size: 13px; display: flex; align-items: center; gap: 8px; cursor: pointer;">
            <input type="checkbox" id="cfgExpandRelated" checked>
            <span>从关注视频拓展抓取相关推荐 (archive/related)</span>
          </label>
        </div>
      </div>
    </div>

    <!-- Right Column: Live Recommendation Playground -->
    <div>
      <div class="card">
        <div class="recommend-toolbar">
          <div class="card-title" style="margin-bottom: 0;">
            <span>✨ AI 推荐实时流预览</span>
            <span style="font-size: 12px; font-weight: normal; color: var(--text-muted); margin-left: 8px;" id="recMetaText"></span>
          </div>

          <div class="search-input-box">
            <input type="text" class="form-input" id="customPromptInput" placeholder="输入自定义兴趣诉求 (如: 硬核科技数码、想看下饭搞笑视频)">
            <button class="btn-primary" style="white-space: nowrap;" onclick="fetchRecommendations()">
              <span>⚡ 生成推荐</span>
            </button>
          </div>
        </div>

        <!-- Video Grid / Loading State -->
        <div id="videoContainer">
          <div class="loading-state">
            <div class="spinner"></div>
            <div>正在抓取免登录视频池并由 AI 分析推荐...</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast">已复制到剪贴板</div>

<script>
  let activeUrl = '';
  let isApiMode = false;
  let currentLanIps = [];
  let currentConfig = {
    creators: [],
    preferences: [],
    expandRelated: true
  };

  // Format seconds to mm:ss
  function formatDuration(sec) {
    if (!sec) return '00:00';
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
  }

  // Format view / danmaku count
  function formatCount(num) {
    if (!num) return '0';
    if (num >= 10000) return (num / 10000).toFixed(1) + '万';
    return num.toString();
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.innerText = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  }

  function copyCurrentUrl() {
    navigator.clipboard.writeText(activeUrl).then(() => {
      showToast('已成功复制网址: ' + activeUrl);
    }).catch(() => {
      // Fallback prompt
      window.prompt('请手动复制:', activeUrl);
    });
  }

  function toggleApiUrlMode() {
    isApiMode = !isApiMode;
    const btn = document.getElementById('urlModeBtn');
    btn.innerText = isApiMode ? '切换基础路径' : '切换API路径';
    updateActiveUrl();
  }

  function updateActiveUrl(customHost) {
    const origin = customHost || window.location.origin;
    activeUrl = isApiMode ? `${origin}/api/recommend` : origin;

    document.getElementById('urlDisplay').innerText = activeUrl;
    // Generate QR code via server's SVG generator
    document.getElementById('qrImage').src = `/api/qrcode?text=${encodeURIComponent(activeUrl)}`;
  }

  // Fetch local LAN IPs to populate quick switcher
  async function loadLanIps() {
    try {
      const res = await fetch('/api/lan-ips');
      const data = await res.json();
      currentLanIps = data.data || [];

      const listEl = document.getElementById('addressList');
      listEl.innerHTML = '';

      // 1. Current Browser URL item
      const currentOrigin = window.location.origin;
      const curItem = document.createElement('div');
      curItem.className = 'address-item active';
      curItem.innerHTML = `<span>当前浏览器: ${currentOrigin}</span><span style="font-size:10px;">默认</span>`;
      curItem.onclick = () => {
        document.querySelectorAll('.address-item').forEach(el => el.classList.remove('active'));
        curItem.classList.add('active');
        updateActiveUrl(currentOrigin);
      };
      listEl.appendChild(curItem);

      // 2. Detected LAN IPs
      const port = window.location.port ? `:${window.location.port}` : '';
      currentLanIps.forEach(item => {
        const lanUrl = `http://${item.address}${port}`;
        if (lanUrl !== currentOrigin) {
          const lanItem = document.createElement('div');
          lanItem.className = 'address-item';
          lanItem.innerHTML = `<span>局域网(${item.name}): ${lanUrl}</span><span style="font-size:10px; color:#10b981;">推荐手机</span>`;
          lanItem.onclick = () => {
            document.querySelectorAll('.address-item').forEach(el => el.classList.remove('active'));
            lanItem.classList.add('active');
            updateActiveUrl(lanUrl);
          };
          listEl.appendChild(lanItem);
        }
      });

      // 3. Android Emulator IP
      const emuUrl = `http://10.0.2.2${port}`;
      const emuItem = document.createElement('div');
      emuItem.className = 'address-item';
      emuItem.innerHTML = `<span>模拟器宿主: ${emuUrl}</span><span style="font-size:10px; color:#00aeec;">模拟器</span>`;
      emuItem.onclick = () => {
        document.querySelectorAll('.address-item').forEach(el => el.classList.remove('active'));
        emuItem.classList.add('active');
        updateActiveUrl(emuUrl);
      };
      listEl.appendChild(emuItem);

    } catch (e) {
      console.warn('Failed to load LAN IPs:', e);
    }
  }

  // Load runtime config
  async function loadConfig() {
    try {
      const res = await fetch('/api/config');
      const json = await res.json();
      const cfg = json.data;
      currentConfig = cfg;

      document.getElementById('cfgBaseUrl').value = cfg.llm?.baseURL || '';
      document.getElementById('cfgModel').value = cfg.llm?.model || '';
      document.getElementById('cfgExpandRelated').checked = cfg.expandRelated !== false;

      renderChips();
    } catch (e) {
      console.error('Config load failed:', e);
    }
  }

  function renderChips() {
    // Render Creators
    const cBox = document.getElementById('creatorsChips');
    cBox.innerHTML = '';
    (currentConfig.creators || []).forEach((c, idx) => {
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.innerHTML = `<span>${c}</span><span class="chip-del" onclick="removeCreator(${idx})">×</span>`;
      cBox.appendChild(chip);
    });

    // Render Prefs
    const pBox = document.getElementById('prefsChips');
    pBox.innerHTML = '';
    (currentConfig.preferences || []).forEach((p, idx) => {
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.innerHTML = `<span>${p}</span><span class="chip-del" onclick="removePref(${idx})">×</span>`;
      pBox.appendChild(chip);
    });
  }

  function addCreator() {
    const input = document.getElementById('newCreatorInput');
    const val = input.value.trim();
    if (val && !currentConfig.creators.includes(val)) {
      currentConfig.creators.push(val);
      input.value = '';
      renderChips();
    }
  }

  function removeCreator(idx) {
    currentConfig.creators.splice(idx, 1);
    renderChips();
  }

  function addPref() {
    const input = document.getElementById('newPrefInput');
    const val = input.value.trim();
    if (val && !currentConfig.preferences.includes(val)) {
      currentConfig.preferences.push(val);
      input.value = '';
      renderChips();
    }
  }

  function removePref(idx) {
    currentConfig.preferences.splice(idx, 1);
    renderChips();
  }

  document.getElementById('newCreatorInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') addCreator();
  });
  document.getElementById('newPrefInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') addPref();
  });

  async function saveConfig() {
    const payload = {
      apiKey: document.getElementById('cfgApiKey').value,
      baseURL: document.getElementById('cfgBaseUrl').value,
      model: document.getElementById('cfgModel').value,
      creators: currentConfig.creators,
      preferences: currentConfig.preferences,
      expandRelated: document.getElementById('cfgExpandRelated').checked,
    };

    try {
      const res = await fetch('/api/config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const data = await res.json();
      if (data.code === 0) {
        showToast('配置已保存并生效！');
        fetchRecommendations();
      }
    } catch (e) {
      showToast('保存失败: ' + e.message);
    }
  }

  // Fetch and display recommendations
  async function fetchRecommendations() {
    const container = document.getElementById('videoContainer');
    container.innerHTML = `
      <div class="loading-state">
        <div class="spinner"></div>
        <div>正在抓取免登录全网候选池，并由 AI 智能匹配推荐...</div>
      </div>
    `;

    const prompt = document.getElementById('customPromptInput').value.trim();
    const startTime = Date.now();

    try {
      const res = await fetch('/api/recommend', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          prompt,
          pageSize: 12,
        }),
      });

      const json = await res.json();
      const duration = ((Date.now() - startTime) / 1000).toFixed(1);

      if (json.code !== 0 || !json.data?.item) {
        container.innerHTML = `<div style="text-align:center; padding:30px; color:#ff4d4f;">获取推荐失败: ${json.message || '未知错误'}</div>`;
        return;
      }

      const items = json.data.item;
      document.getElementById('recMetaText').innerText = `候选池: ${json.data.candidate_pool_size || 0} 部 • 模型: ${json.data.llm_model} • 耗时: ${duration}s`;

      if (items.length === 0) {
        container.innerHTML = `<div style="text-align:center; padding:30px; color:var(--text-muted);">暂无推荐内容</div>`;
        return;
      }

      const grid = document.createElement('div');
      grid.className = 'video-grid';

      items.forEach(v => {
        const card = document.createElement('div');
        card.className = 'video-card';

        const reason = v.rcmd_reason?.content || 'AI智能优选';
        const sourceTag = v.sourceTag || '推荐';

        const avatarHtml = v.owner?.face
          ? `<img class="up-avatar" src="${v.owner.face}" referrerpolicy="no-referrer" alt="${v.owner.name}" onerror="if (!this.dataset.fallback) { this.dataset.fallback = '1'; this.src = '/api/proxy-image?url=' + encodeURIComponent('${v.owner.face}'); } else { this.style.display='none'; }">`
          : `<span class="up-avatar" style="display:inline-flex; align-items:center; justify-content:center; background:#ff8eb3; color:white; font-size:10px; font-weight:bold;">UP</span>`;

        card.innerHTML = `
          <div class="video-thumb-box">
            <img class="video-thumb" src="${v.pic}" referrerpolicy="no-referrer" alt="${v.title}" onerror="if (!this.dataset.fallback) { this.dataset.fallback = '1'; this.src = '/api/proxy-image?url=' + encodeURIComponent('${v.pic}'); }">
            <span class="video-source-badge">${sourceTag}</span>
            <span class="video-duration">${formatDuration(v.duration)}</span>
          </div>
          <div class="video-content">
            <a class="video-title" href="https://www.bilibili.com/video/${v.bvid}" target="_blank" title="${v.title}">
              ${v.title}
            </a>
            <div class="video-reason-badge">
              <span>🔥 ${reason}</span>
            </div>
            <div class="video-footer">
              <div class="video-up">
                ${avatarHtml}
                <span>${v.owner?.name || 'UP主'}</span>
              </div>
              <div style="display:flex; gap:8px;">
                <span>▶ ${formatCount(v.stat?.view)}</span>
                <span>💬 ${formatCount(v.stat?.danmaku)}</span>
              </div>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });

      container.innerHTML = '';
      container.appendChild(grid);

    } catch (e) {
      container.innerHTML = `<div style="text-align:center; padding:30px; color:#ff4d4f;">网络请求异常: ${e.message}</div>`;
    }
  }

  // Initialization
  window.addEventListener('DOMContentLoaded', async () => {
    updateActiveUrl();
    await loadLanIps();
    await loadConfig();
    fetchRecommendations();
  });
</script>

</body>
</html>
